[project]
name = "j315scan"
version = "0.2.0"
description = "Unofficial Brother DCP-J315W network scanner (TCP 54921)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "j315scan contributors" }]
keywords = ["brother", "scanner", "dcp-j315w", "sane", "brscan"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Capture :: Scanners",
]
dependencies = [
  "Pillow>=10",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.scripts]
j315scan = "cli:main"

[project.urls]
Changelog = "CHANGELOG.md"

[tool.setuptools]
py-modules = ["app", "cli", "protocol", "extract", "config", "i18n"]
